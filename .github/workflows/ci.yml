name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/userspace/go.mod
          cache-dependency-path: src/userspace/go.sum

      - name: Install BPF toolchain
        run: sudo apt-get update && sudo apt-get install -y clang libbpf-dev linux-libc-dev llvm

      - name: Generate BPF objects
        run: make generate

      - name: Drift check (committed bindings must match)
        run: git diff --exit-code -- src/userspace/tyto_bpfel.go src/userspace/tyto_bpfeb.go src/userspace/tyto_bpfel.o src/userspace/tyto_bpfeb.o

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/userspace/tyto
          generate_release_notes: true
